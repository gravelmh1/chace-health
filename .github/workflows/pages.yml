# GitHub Pages 배포 — 외부 계정(Vercel/Netlify) 없이 이 저장소만으로 배포한다.
#
# ⚠ 먼저 한 번만 켜야 한다:
#   저장소 Settings → Pages → Source → "GitHub Actions"
#
# 그 전까지 이 워크플로는 실패한다. enablement: true 로 자동 생성을 시도해 봤지만
# Actions 토큰으로는 안 된다:
#
#   Create Pages site failed. Error: Resource not accessible by integration
#
# pages: write 권한은 "배포"만 허용하고, Pages 사이트 "생성"은 저장소 admin
# 권한이 필요하기 때문이다. 즉 사람이 한 번 눌러줘야 하는 단계다.
# (enablement: true 는 그대로 둔다 — 권한이 있는 환경에서는 이 한 줄이 일을 덜어준다)
#
# private 저장소의 Pages 는 GitHub Pro 이상에서만 동작한다. 무료 플랜이면
# 저장소를 public 으로 바꾸거나 Vercel/Netlify 를 쓰면 된다.
# anon key 는 코드에 들어있지 않고 앱에서 입력하므로, public 으로 바꿔도
# 키가 노출되지 않는다. (DB 접근 통제는 RLS 가 한다)

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 배포 대상만 추리기
        run: |
          mkdir -p _site
          cp index.html app.css icon.png manifest.webmanifest _site/
          cp -r js tools _site/

      # GitHub Pages 는 파일에 10분 캐시를 건다. 그래서 새로 배포해도
      # 아이폰이 옛 JS 를 계속 쓰는 일이 생긴다 — 이 앱이 고친 문제와 같은 종류다.
      # 파일 내용은 그대로 두고 참조 주소에만 커밋 해시를 붙여, 배포마다
      # 다른 URL 이 되게 한다. 캐시가 살아 있어도 새 주소는 새로 받는다.
      - name: 정적 파일 주소에 버전 붙이기
        run: |
          V="${GITHUB_SHA::12}"
          # JS 모듈끼리의 상대 import
          find _site/js -name '*.js' -print0 | xargs -0 sed -i -E "s|(from '\./[^']+\.js)'|\1?v=$V'|g"
          # 진입점과 스타일시트
          sed -i -E "s|(href=\"app\.css)\"|\1?v=$V\"|" _site/index.html
          sed -i -E "s|(from '\./js/ui\.js)'|\1?v=$V'|" _site/index.html
          sed -i -E "s|(from '\.\./js/[^']+\.js)'|\1?v=$V'|g" _site/tools/*.html
          echo "버전 $V 적용:"
          grep -o "ui\.js?v=[a-f0-9]*" _site/index.html | head -1
          grep -o "config\.js?v=[a-f0-9]*" _site/js/ui.js | head -1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
