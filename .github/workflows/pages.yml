# GitHub Pages 배포 — 외부 계정(Vercel/Netlify) 없이 이 저장소만으로 배포한다.
#
# 켜는 법: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꾸면 끝.
# (private 저장소의 Pages 는 GitHub Pro 이상에서만 동작합니다. 무료 계정이면
#  저장소를 public 으로 바꾸거나 Vercel/Netlify 를 쓰세요. anon key 는 코드에
#  들어있지 않고 앱에서 입력하므로, public 으로 바꿔도 키가 노출되지 않습니다.)

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 배포 대상만 추리기
        run: |
          mkdir -p _site
          cp index.html app.css icon.png manifest.webmanifest _site/
          cp -r js tools _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
